name: Feature Branch - Docker Build

on:
  push:

permissions:
  packages: write

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case repository name
        run: echo "REPO_NAME=$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        env: 
            GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG
        shell: bash
        run: |
          # Strip refs/heads/ or refs/tags/ prefixes
          REF="${GITHUB_REF#refs/heads/}"
          REF="${REF#refs/tags/}"
          # Lowercase and replace invalid characters with '-'
          IMAGE_TAG="${REF,,}"
          IMAGE_TAG=$(echo "$IMAGE_TAG" | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-128)
          # Fallback to short SHA if empty
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG=${GITHUB_SHA::7}
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Show IMAGE_TAG
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}